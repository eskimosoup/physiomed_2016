en:
  simple_form:
    "yes": 'Yes'
    "no": 'No'
    required:
      text: 'required'
      mark: '*'
      # You can uncomment the line below if you need to overwrite the whole required html.
      # When using html, text and mark won't be used.
      # html: '<abbr title="required">*</abbr>'
    error_notification:
      default_message: "Please review the problems below:"
    # Examples
    # labels:
    #   defaults:
    #     password: 'Password'
    #   user:
    #     new:
    #       email: 'E-mail to sign in.'
    #     edit:
    #       email: 'E-mail.'
    # hints:
    #   defaults:
    #     username: 'User name to sign in.'
    #     password: 'No special characters, please.'
    # include_blanks:
    #   defaults:
    #     age: 'Rather not say'
    # prompts:
    #   defaults:
    #     age: 'Select your age'
    labels:
      practice_application:
        number_of_locations: How many locations do you have?
        other_locations: Other locations (inc Postcode)
        manual_therapy: What % of your treatments are manual therapy?
        capacity: What % of capacity are you running at?
        receptionist: Do you have a full time receptionist?
        disabled_access: Do you have disabled access?
        tm2_or_pps: Do you have TM2 or PPS?
        online_booking: If so, do you utilise the online booking?
        bupa_registered: Are you BUPA Registered?
        domiciliary_visits: Do you do Domiciliary visits?
        parking_facilities: Do you have parking facilities?
        established: Date practice opened
        cancellation_policy: What is your cancellation policy?
        description: Describe your practice i.e. within gym, GP practice, converted building etc.
        public_liability_insurance: Do you have public liability insurance?
        employee_liability_insurance: Do you have employee liability insurance?
        treatment_rooms: How many treatment rooms do you have?
        initial_assessment_cost: Initial assessment (in £)
        initial_assessment_duration: Initial assessment duration (30 or 60 mins)
        subsequent_treatment_cost: Subsequent treatments (in £)
        price_history: History of price increases (date and price increase)
        terms_and_conditions: I accept the terms and conditions
        acupuncture_offered: Do you offer Acupuncture as part of treatment?
        womens_health_offered: Do you offer Women's Health as part of treatment?
        shockwave_offered: Do you offer Shockwave as part of treatment?
        other_treatments_offered: Are there any other types of treatment you provide?
        dse_offered: Do you Provide DSE Assessments?
        vehicle_assessments_offered: Do you Provide Vehicle Assessments?
        number_of_days_till_ia_booked: Number of days on average until IA booked?
        parking_facilities_information: If not please provide details of the nearest parking facilities.
        practitioners:
          name: Name of practitioner
          qualification_date: Date of qualifying
          years_practicing: No. of years MSK experience
